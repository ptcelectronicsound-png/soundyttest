<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอเพลง</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f1ec;--card:#fff;--tx:#1b1b1f;--mu:#6b6b76;--ac:#e0457b;--bd:#ddd8d0}
@media (prefers-color-scheme:dark){:root{--bg:#101015;--card:#1b1b23;--tx:#f2f2f6;--mu:#9a9aa8;--ac:#ff5c93;--bd:#2c2c38;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:16px}
.hide{display:none!important}
button,input{font:inherit}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
#screen{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;gap:14px;height:100%;padding:14px}
#qrbox{text-align:center}
#qr{display:inline-block;background:#fff;padding:16px;border-radius:12px;margin-top:6px}
#qr img,#qr canvas{display:block}
#videoBox{grid-column:2;grid-row:1/3;position:relative;background:#000;border-radius:16px;overflow:hidden}
#player,#player iframe,#player video{width:100%;height:100%;border:0;display:block}
#chatBox{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg b{color:var(--ac)}
.small{font-size:13px;color:var(--mu)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px}
#nowbar{position:absolute;left:0;right:0;top:0;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.75),transparent);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2;pointer-events:none}
#nowbar button{pointer-events:auto;background:#0008;border:1px solid #fff8}
#remote{max-width:520px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#remote .msgs{max-height:50vh;min-height:200px}
.row{display:flex;gap:8px}
label.file{display:block;border:2px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;color:var(--mu);cursor:pointer}
@media (max-width:800px){#screen{grid-template-columns:1fr;grid-template-rows:auto 40vh 1fr;overflow:auto;height:auto}#videoBox{grid-column:1;grid-row:2}}
</style>
</head>
<body>

<div id="screen" class="hide">
  <div id="qrbox" class="card">
    <b>สแกนเพื่อขอเพลง / แชท</b><br>
    <div id="qr"></div>
    <div id="qrUrl" class="small" style="word-break:break-all;margin-top:8px"></div>
    <div class="small" id="queueInfo"></div>
  </div>
  <div id="videoBox">
    <div id="player"></div>
    <div id="overlay"><div style="font-size:28px;font-weight:700">🎵 ขอเพลงหน้าจอ</div><div id="ovText">สแกน QR เพื่อขอเพลง</div><button id="startBtn">▶ เริ่มเล่น</button></div>
    <div id="nowbar" class="hide"><span id="nowTxt"></span><button id="skipBtn">ข้าม ⏭</button></div>
  </div>
  <div id="chatBox" class="card"><b style="margin-bottom:6px">💬 แชท</b><div class="msgs" id="msgsS"></div></div>
</div>

<div id="remote" class="hide">
  <h2 style="margin:4px 0">🎵 ขอเพลง</h2>
  <input type="text" id="nick" placeholder="ชื่อของคุณ" maxlength="24">
  <div class="tabs"><button id="tabSong" class="on">ขอเพลง</button><button id="tabChat">พิมพ์แชท</button></div>
  <div id="paneSong" class="card" style="display:flex;flex-direction:column;gap:10px">
    <input type="text" id="yt" placeholder="วางลิงก์ YouTube">
    <button id="sendYt">ขอเพลงจากลิงก์</button>
    <div class="small" style="text-align:center">— หรือ —</div>
    <label class="file"><input type="file" id="file" accept="audio/mpeg,video/mp4,.mp3,.mp4" hidden><span id="fileTxt">📁 เลือกไฟล์ .mp3 / .mp4</span></label>
    <button id="sendFile" class="hide">อัปโหลดและขอเพลง</button>
    <div class="small" id="songStatus"></div>
    <div class="small" id="queueR"></div>
  </div>
  <div id="paneChat" class="card" style="display:none;flex-direction:column;gap:10px">
    <div class="msgs" id="msgsR"></div>
    <div class="row"><input type="text" id="msg" placeholder="พิมพ์ข้อความ..." maxlength="200"><button id="sendMsg">ส่ง</button></div>
  </div>
</div>

<script>
const isRemote = location.pathname === "/remote";
const $ = id => document.getElementById(id);
let queue = [], chat = [], curId = null, started = false;

const post = (url, data) => fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };
const nick = () => ($("nick").value || "").trim() || "ไม่ระบุชื่อ";
const pending = () => queue.filter(x => !x.played);

function renderChat(el){
  el.textContent = "";
  chat.slice(-60).forEach(m => {
    const d = document.createElement("div"); d.className = "msg";
    const b = document.createElement("b"); b.textContent = m.name + ": ";
    d.append(b, document.createTextNode(m.text)); el.append(d);
  });
  el.scrollTop = el.scrollHeight;
}
function onQueue(){
  const p = pending();
  if (isRemote){ $("queueR").textContent = p.length ? "คิวเพลงตอนนี้: " + p.length + " เพลง" : "ยังไม่มีคิว ขอเพลงแรกได้เลย!"; return; }
  $("queueInfo").textContent = p.length > 1 ? "คิวถัดไป " + (p.length - 1) + " เพลง" : "";
  const cur = p[0];
  if (!cur){
    curId = null; $("player").textContent = ""; $("nowbar").classList.add("hide");
    $("overlay").classList.remove("hide"); $("startBtn").classList.toggle("hide", started);
    $("ovText").textContent = "สแกน QR เพื่อขอเพลง"; return;
  }
  if (!started){ $("ovText").textContent = "มีเพลงในคิวแล้ว กดเริ่มเล่น"; return; }
  if (cur.id !== curId) play(cur);
}
function play(cur){
  curId = cur.id;
  $("overlay").classList.add("hide"); $("nowbar").classList.remove("hide");
  $("nowTxt").textContent = "▶ " + cur.title + " · ขอโดย " + cur.by;
  const box = $("player"); box.textContent = "";
  if (cur.type === "yt"){
    const f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(cur.vid) + "?autoplay=1&rel=0";
    f.allow = "autoplay; encrypted-media; fullscreen"; f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    box.append(f);
  } else {
    const v = document.createElement("video");
    v.src = cur.url; v.controls = true; v.autoplay = true;
    v.addEventListener("ended", next); box.append(v);
  }
}
function next(){ const c = pending()[0]; if (c) post("/api/next", {id:c.id}); }

function connect(){
  const es = new EventSource("/events");
  es.onmessage = e => {
    const s = JSON.parse(e.data); queue = s.queue; chat = s.chat;
    onQueue(); renderChat($(isRemote ? "msgsR" : "msgsS"));
  };
}

async function initScreen(){
  $("screen").classList.remove("hide");
  let url = location.origin + "/remote";
  if (["localhost","127.0.0.1"].includes(location.hostname)){
    try { const i = await (await fetch("/api/info")).json();
      if (i.ips[0]) url = "http://" + i.ips[0] + ":" + i.port + "/remote"; } catch(e){}
  }
  try { new QRCode($("qr"), {text:url, width:240, height:240, correctLevel:QRCode.CorrectLevel.L}); }
  catch(e){ $("qr").textContent = "QR ไม่ขึ้น (ต้องต่ออินเทอร์เน็ตเพื่อโหลดตัวสร้าง QR)"; }
  $("qrUrl").textContent = url;
  $("startBtn").onclick = () => { started = true; $("startBtn").classList.add("hide"); onQueue(); };
  $("skipBtn").onclick = next;
}
function initRemote(){
  $("remote").classList.remove("hide");
  try { $("nick").value = localStorage.getItem("nick") || ""; } catch(e){}
  $("nick").addEventListener("change", () => { try { localStorage.setItem("nick", $("nick").value); } catch(e){} });
  const tab = s => { $("tabSong").classList.toggle("on", s); $("tabChat").classList.toggle("on", !s);
    $("paneSong").style.display = s ? "flex" : "none"; $("paneChat").style.display = s ? "none" : "flex"; };
  $("tabSong").onclick = () => tab(true); $("tabChat").onclick = () => tab(false);
  $("sendYt").onclick = async () => {
    const id = ytId($("yt").value);
    if (!id){ $("songStatus").textContent = "ลิงก์ YouTube ไม่ถูกต้อง"; return; }
    const r = await post("/api/song", {vid:id, by:nick()});
    $("songStatus").textContent = r.ok ? "✅ เพิ่มเข้าคิวแล้ว!" : "ส่งไม่สำเร็จ"; if (r.ok) $("yt").value = "";
  };
  $("file").onchange = () => { const f = $("file").files[0];
    $("fileTxt").textContent = f ? "📄 " + f.name : "📁 เลือกไฟล์ .mp3 / .mp4";
    $("sendFile").classList.toggle("hide", !f); };
  $("sendFile").onclick = () => {
    const f = $("file").files[0]; if (!f) return;
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload?name=" + encodeURIComponent(f.name) + "&by=" + encodeURIComponent(nick()));
    x.upload.onprogress = e => { if (e.lengthComputable) $("songStatus").textContent = "กำลังอัปโหลด " + Math.round(e.loaded / e.total * 100) + "%"; };
    x.onload = () => {
      if (x.status === 200){ $("songStatus").textContent = "✅ เพิ่มเข้าคิวแล้ว!"; $("file").value = ""; $("fileTxt").textContent = "📁 เลือกไฟล์ .mp3 / .mp4"; $("sendFile").classList.add("hide"); }
      else $("songStatus").textContent = "อัปโหลดไม่สำเร็จ: " + x.responseText;
    };
    x.onerror = () => { $("songStatus").textContent = "อัปโหลดไม่สำเร็จ"; };
    x.send(f);
  };
  const sendChat = async () => { const t = $("msg").value.trim(); if (!t) return; $("msg").value = ""; await post("/api/chat", {name:nick(), text:t}); };
  $("sendMsg").onclick = sendChat;
  $("msg").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
}
isRemote ? initRemote() : initScreen();
connect();
</script>
</body>
</html>
